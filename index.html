function settled(b){return ['won','lost','void','partial'].includes(b.status)}function net(b){return settled(b)?Number(b.returnAmount||0)-Number(b.stake||0):0}function eligible(b){return ['won','lost','partial'].includes(b.status)}function cashStats(bets=db.bets){let done=bets.filter(settled), eligibleB=done.filter(eligible),stake=done.reduce((a,b)=>a+Number(b.stake||0),0),ret=done.reduce((a,b)=>a+Number(b.returnAmount||0),0),profit=done.reduce((a,b)=>a+net(b),0),wins=eligibleB.filter(b=>net(b)>0).length,open=bets.filter(b=>b.status==='pending'),committed=open.reduce((a,b)=>a+Number(b.stake||0),0),transactions=db.transactions.reduce((a,t)=>a+(t.type==='deposit'?Number(t.amount):-Number(t.amount)),0),bank=Number(db.profile?.initialBankroll||0)+transactions+profit;return {done,eligibleB,stake,ret,profit,roi:stake?profit/stake*100:0,wins,hit:eligibleB.length?wins/eligibleB.length*100:0,open,committed,bank,available:bank-committed}}

function chartSVG(bets){let done=bets.filter(settled).sort((a,b)=>new Date(a.placedAt)-new Date(b.placedAt));if(!done.length)return '<div class="empty">Registre apostas liquidadas para visualizar a evolução.<br>Dados demonstrativos não são utilizados.</div>';let bal=Number(db.profile?.initialBankroll||0),points=[bal];done.forEach(b=>{bal+=net(b);points.push(bal)});let w=690,h=190,pad=20,min=Math.min(...points),max=Math.max(...points),range=max-min||1,coords=points.map((v,i)=>[pad+i*(w-2*pad)/Math.max(1,points.length-1),h-pad-(v-min)/range*(h-2*pad)]),d=coords.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '),fill=d+` L ${coords.at(-1)[0]} ${h-pad} L ${coords[0][0]} ${h-pad} Z`;return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Evolução do saldo em ${done.length} apostas"><defs><linearGradient id="chartFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#a9ed5e" stop-opacity=".2"/><stop offset="1" stop-color="#a9ed5e" stop-opacity="0"/></linearGradient></defs><line class="gridline" x1="${pad}" y1="${pad}" x2="${w-pad}" y2="${pad}"/><line class="gridline" x1="${pad}" y1="${h/2}" x2="${w-pad}" y2="${h/2}"/><line class="gridline" x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}"/><path class="chartfill" d="${fill}"/><path class="chartline" d="${d}"/>${coords.length<=12?coords.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#a9ed5e"/>`).join(''):''}<text x="${pad}" y="${h-2}" class="axis">${esc(dateFmt(done[0].placedAt))}</text><text x="${w-pad}" y="${h-2}" text-anchor="end" class="axis">${esc(dateFmt(done.at(-1).placedAt))} · ${done.length} liquidadas</text><text x="${pad+3}" y="${pad+12}" class="axis">${esc(money(max))}</text><text x="${pad+3}" y="${h-pad-3}" class="axis">${esc(money(min))}</text></svg>`}
function dailyBars(){let grouped={};db.bets.filter(settled).forEach(b=>{let d=dayKey(b.placedAt);grouped[d]=(grouped[d]||0)+net(b)});let vals=Object.entries(grouped).sort().slice(-7);if(!vals.length)return '<div class="empty">Sem resultados liquidados no período.</div>';let scale=Math.max(1,...vals.map(([,x])=>Math.abs(x)));return vals.map(([d,v])=>`<div class="barrow"><span>${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit'})}</span><div class="barbg"><div class="barfill ${v<0?'neg':''}" style="width:${Math.max(3,Math.abs(v)/scale*100)}%"></div></div><b class="${v>=0?'positive':'negative'}" style="text-align:right">${money(v)}</b></div>`).join('')}

function goalView(){let s=cashStats(),p=db.profile||{reserve:0,dailyLimit:0,weeklyLimit:0,monthlyLimit:0,maxStake:0};return `<div class="heading"><div><div class="eyebrow">Acompanhamento e proteção</div><h1>Metas e limites</h1><p>Limites definidos por você têm prioridade sobre objetivos financeiros.</p></div><div class="actions"><button class="btn" id="addGoal">＋ Criar meta</button><button class="btn primary" id="addLimit">Configurar limites</button></div></div><div class="stats"><div class="stat"><div class="statlabel">Reserva mínima</div><div class="statnum">${money(p.reserve)}</div><div class="statnote">Disponível atual: ${money(s.available)}</div></div><div class="stat"><div class="statlabel">Limite diário</div><div class="statnum">${p.dailyLimit?money(p.dailyLimit):'—'}</div><div class="statnote">Resultado hoje: ${money(sessionLoss(1))}</div></div><div class="stat"><div class="statlabel">Limite semanal</div><div class="statnum">${p.weeklyLimit?money(p.weeklyLimit):'—'}</div><div class="statnote">Resultado 7 dias: ${money(sessionLoss(7))}</div></div><div class="stat"><div class="statlabel">Limite mensal</div><div class="statnum">${p.monthlyLimit?money(p.monthlyLimit):'—'}</div><div class="statnote">Resultado 30 dias: ${money(sessionLoss(30))}</div></div></div><div class="split"><article class="panel"><div class="panel-head"><div><h2>Seus objetivos</h2><p>Objetivos de acompanhamento, não rendimentos previstos</p></div></div><div class="panel-body">${db.goals.length?db.goals.map(g=>{let actual=g.type==='count'?db.bets.filter(b=>dayKey(b.placedAt)>=g.start&&dayKey(b.placedAt)<=g.end).length:g.type==='exposure'?db.bets.filter(b=>dayKey(b.placedAt)>=g.start&&dayKey(b.placedAt)<=g.end).reduce((a,b)=>a+Number(b.stake),0):Math.max(0,-db.bets.filter(b=>settled(b)&&dayKey(b.placedAt)>=g.start&&dayKey(b.placedAt)<=g.end).reduce((a,b)=>a+net(b),0));let progress=Math.min(100,actual/Number(g.target||1)*100);return `<div class="goal"><div class="goalhead"><span>${esc(g.name)}</span><button class="btn quiet" data-delete-goal="${esc(g.id)}">Remover</button></div><div class="goalmeta">${g.type==='count'?'Apostas':g.type==='exposure'?'Exposição máxima':'Limite de perda'} · ${money(g.type==='count'?0:g.target)}${g.type==='count'?g.target+' registros':''} · ${dateFmt(g.start)} — ${dateFmt(g.end)}</div><div class="progress"><i style="width:${progress}%"></i></div><div class="goalmeta">${g.type==='count'?actual+' de '+g.target+' registros':money(actual)+' de '+money(g.target)}</div></div>`}).join(''):'<div class="empty">Crie um objetivo para acompanhar volume, exposição ou limite de perda.<br>Metas não recomendam aumento de risco.</div>'}</div></article><article class="panel"><div class="panel-head"><div><h2>Opções de pausa</h2><p>Faça uma pausa de acompanhamento sempre que precisar</p></div></div><div class="panel-body"><p class="smallmuted" style="font-size:11px">A pausa suspende novos registros nesta ferramenta. Ela não bloqueia atividade em plataformas externas.</p><div class="actions"><button class="btn" data-pause-days="1">Pausa de 24 horas</button><button class="btn" data-pause-days="7">Pausa de 7 dias</button></div>${db.pausedUntil&&new Date(db.pausedUntil)>new Date()?`<div class="notice red" style="margin-top:15px">Pausa ativa até ${new Date(db.pausedUntil).toLocaleString('pt-BR')}</div>`:''}<div class="safety">Se apostar estiver causando estresse ou prejuízo, converse com alguém de confiança e busque apoio profissional. Considere excluir os registros e interromper o uso.</div><button class="btn danger" id="deleteData">Excluir todos os dados locais</button></div></article></div>`}

function deterministicAnswer(q){let done=db.bets.filter(settled);if(done.length<1)return 'Ainda não há apostas liquidadas para analisar. Registre resultados reais para receber um resumo.';if(q.includes('semana')){let n=sessionLoss(7),list=db.bets.filter(b=>settled(b)&&new Date(b.placedAt)>=new Date(Date.now()-7*864e5)),s=list.reduce((a,b)=>a+Number(b.stake),0);return `Nos últimos 7 dias há ${list.length} apostas liquidadas, resultado de ${money(n)} e ROI de ${s?pct(n/s*100):'—'}. Esse resumo descreve os registros disponíveis; não prevê o desempenho futuro.`}if(q.includes('horário')){let v={};done.forEach(b=>{let h=getHour(b);v[h]=(v[h]||0)+net(b)});let x=Object.entries(v).sort((a,b)=>b[1]-a[1])[0];return x?`O maior resultado líquido observado foi às ${String(x[0]).padStart(2,'0')}h: ${money(x[1])}, com base em ${done.filter(b=>getHour(b)===+x[0]).length} apostas. É uma observação histórica com amostra potencialmente limitada, sem garantia futura.`:'Dados insuficientes.'}if(q.includes('modalidade')){let v={};done.forEach(b=>{let k=b.category||'Sem modalidade';v[k]=(v[k]||0)+net(b)});let x=Object.entries(v).sort((a,b)=>a[1]-b[1])[0];return x?`Maior prejuízo agregado observado: ${x[0]}, ${money(x[1])}, em ${done.filter(b=>(b.category||'Sem modalidade')===x[0]).length} apostas liquidadas.`:'Dados insuficientes.'}if(q.includes('limites')){let a=limitAlerts();return a.length?`Há ${a.length} alerta(s): ${a.map(x=>x.title).join('; ')}. Considere fazer uma pausa e revisar seus limites.`:'Não há limites configurados atingidos com base nos registros recentes. Confira se seus limites foram configurados; isso não avalia apostas fora deste sistema.'}if(q.includes('depois')){let sorted=[...db.bets].sort((a,b)=>new Date(a.placedAt)-new Date(b.placedAt)),n=0;for(let i=1;i<sorted.length;i++)if(net(sorted[i-1])<0)n++;return `Foram encontrados ${n} registros após outro registro anterior com resultado negativo. A proximidade temporal não demonstra que o resultado anterior causou a aposta seguinte.`}return 'Sem dados suficientes para responder com confiança.'}

async function establishSession(){if(verification)return verification;verification=(async()=>{authState='checking';render();try{let {data,error}=await authClient.auth.getUser();if(error||!data.user)throw error||Error('Sessão indisponível');if(recoveryPending){authUser=data.user;authState='authenticated';authScreen='recovery';renderAuth();return true}authUser=data.user;activeStorageKey=`${KEY}:${authUser.id}:cloud-cache`;cloudReady=false;cloudSyncError='';db=load();try{const remoteState=await readUserData(authClient,authUser.id);if(remoteState){const checkedRemote=validateBackup(remoteState);if(!checkedRemote.valid)throw Error('Os dados da conta no Supabase têm formato inválido. O cache local foi preservado.');db={...fresh(),...checkedRemote.backup}}cloudReady=true}catch(loadError){console.error('Falha ao carregar os dados privados do Supabase.',{code:loadError?.code,message:loadError?.message});cloudSyncError=`Não foi possível carregar os dados da nuvem: ${friendlyAuthError(loadError)}. O painel está em modo de leitura até a conexão ser restabelecida.`}authState='authenticated';authScreen='home';authError='';authNotice='';render();return true}catch(err){authUser=null;activeStorageKey=null;cloudReady=false;authState='error';authError=friendlyAuthError(err);render();return false}finally{verification=null}})();return verification}

async function bootAuth(){if(window.location.hash.includes('type=recovery')){authScreen='recovery';recoveryPending=true}else{authScreen=authScreenFromHash(window.location.hash)}if(!configured){authState='not-configured';authUser=null;render();return}authState='checking';render();try{authClient=createClient(import.meta.env.VITE_SUPABASE_URL,supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});authClient.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){recoveryPending=true;authScreen='recovery';authError='';renderAuth();return}if(event==='SIGNED_OUT'){authUser=null;activeStorageKey=null;cloudReady=false;db=fresh();authState='ready';authScreen='home';render();return}if(session&&['INITIAL_SESSION','SIGNED_IN','TOKEN_REFRESHED','USER_UPDATED'].includes(event))setTimeout(()=>{if(!authUser||authUser.id!==session.user?.id)establishSession()},0)});let {data,error}=await authClient.auth.getSession();if(error)throw error;if(data.session){await establishSession()}else{authState='ready';authUser=null;activeStorageKey=null;cloudReady=false;db=fresh();if(window.location.hash.includes('type=recovery')){recoveryPending=false;authScreen='forgot';authNotice='Este link não está mais válido. Solicite uma nova redefinição de senha.';history.replaceState(null,'',window.location.pathname+window.location.search)}render()}}catch(err){authState='error';authError=friendlyAuthError(err);render()}}
function navigate(v){if(!authUser||!activeStorageKey)return;currentView=v;$$('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+v));$$('.nav button[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));let n={dashboard:'Visão geral',bets:'Apostas',analysis:'Análises',goals:'Metas e limites',assistant:'Assistente',settings:'Perfil e dados'};$('#crumb').textContent='Painel / '+n[v];$('#sidebar').classList.remove('open');render()}
function render(){if(!privateAreaAllowed({verifiedUser:authUser,userStorageKey:activeStorageKey})){$('#app').hidden=true;renderAuth();return}$('#authRoot').hidden=true;$('#app').hidden=false;$('#avatar').textContent=(db.profile?.name||'B').slice(0,1).toUpperCase();$('#currentEmail').textContent=authUser.email||'Conta autenticada';$('#view-dashboard').innerHTML=(cloudSyncError?`<div class="notice red" role="alert"><div><strong>Dados da nuvem indisponíveis</strong>${esc(cloudSyncError)}</div><button id="retryCloudLoad" class="btn" type="button">Tentar novamente</button></div>`:'')+dashboard();$('#view-bets').innerHTML=betList();$('#view-analysis').innerHTML=analysis();$('#view-goals').innerHTML=goalView();$('#view-assistant').innerHTML=assistantView();$('#view-settings').innerHTML=settingsView();bind();if(!cloudReady)$$('#app button:not(#logoutBtn):not(#retryCloudLoad):not(#exportJson):not(#exportCsv):not(#downloadPreviousAccountBackup):not(#downloadLegacyData), #app input, #app select, #app textarea').forEach(control=>control.disabled=true)}
function bind(){$$('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));$$('[data-view-link]').forEach(b=>b.onclick=()=>navigate(b.dataset.viewLink));$$('[data-add-bet]').forEach(b=>b.onclick=()=>betModal());$$('[data-edit]').forEach(b=>b.onclick=()=>betModal(db.bets.find(x=>x.id===b.dataset.edit)));$$('[data-pause]').forEach(b=>b.onclick=()=>pause(1));$$('[data-pause-days]').forEach(b=>b.onclick=()=>pause(Number(b.dataset.pauseDays)));$$('[data-delete-goal]').forEach(b=>b.onclick=()=>{db.goals=db.goals.filter(g=>g.id!==b.dataset.deleteGoal);save()});let sb=$('#searchBets');if(sb)sb.oninput=()=>{betFilters.q=sb.value;let pos=sb.selectionStart;$('#view-bets').innerHTML=betList();bind();let inp=$('#searchBets');inp.focus();inp.setSelectionRange(pos,pos)};let fs=$('#filterStatus');if(fs)fs.onchange=()=>{betFilters.status=fs.value;render()};let fp=$('#filterPeriod');if(fp)fp.onchange=()=>{betFilters.period=fp.value;render()};$$('#exportCsv').forEach(b=>b.onclick=exportCSV);let ec=$('#exportCsv');if(ec)ec.onclick=exportCSV;let ic=$('#importCsv');if(ic)ic.onclick=importCSV;let ef=$('#exportJson');if(ef)ef.onclick=exportJSON;let legacy=$('#downloadLegacyData');if(legacy)legacy.onclick=()=>downloadLegacyBackup(readLegacyBackup(localStorage));let previousBackup=$('#downloadPreviousAccountBackup');if(previousBackup)previousBackup.onclick=downloadPreviousAccountBackup;let retryCloud=$('#retryCloudLoad');if(retryCloud)retryCloud.onclick=()=>establishSession();let tx=$('#addTransaction');if(tx)tx.onclick=transactionModal;let ag=$('#addGoal');if(ag)ag.onclick=goalModal;let al=$('#addLimit');if(al)al.onclick=limitModal;let ask=$('#ask');if(ask)ask.onclick=()=>$('#answer').textContent=deterministicAnswer($('#question').value.toLowerCase().includes('semana')?'semana':$('#question').value.toLowerCase().includes('horário')?'horário':$('#question').value.toLowerCase().includes('modalidade')?'modalidade':$('#question').value.toLowerCase().includes('limites')?'limites':'depois');$$('#deleteData').forEach(b=>b.onclick=deleteData);let pf=$('#profileForm');if(pf)pf.onsubmit=async e=>{e.preventDefault();if(!pf.reportValidity())return;const checked=validateProfileDraft(Object.fromEntries(new FormData(pf)));if(!checked.valid){const [key,message]=Object.entries(checked.errors)[0],field=pf.elements.namedItem(key);if(field){field.setCustomValidity(message);field.reportValidity();field.setCustomValidity('')}return}const button=pf.querySelector('button[type=submit]');button.disabled=true;button.textContent='Salvando…';db.profile=checked.profile;const saved=await save({deferRender:true});if(saved){render();toast('Configurações salvas na nuvem.')}else{const note=$('#profileSaveError');if(note){note.textContent=cloudSyncError;note.hidden=false}button.disabled=false;button.textContent='Tentar salvar novamente'}};let menu=$('#menuBtn');if(menu)menu.onclick=()=>$('#sidebar').classList.toggle('open')}
async function deleteData(){if(!confirm('Excluir permanentemente os dados desta conta no navegador e na nuvem? Esta ação não pode ser desfeita.'))return;try{const {error}=await authClient.from('betbank_user_data').delete().eq('user_id',authUser.id);if(error)throw error;if(activeStorageKey)localStorage.removeItem(activeStorageKey);db=fresh();cloudSyncError='';render();toast('Dados da conta excluídos.')}catch(error){toast(`Não foi possível excluir os dados na nuvem: ${friendlyAuthError(error)}`)}}
document.addEventListener('click',e=>{if(e.target.matches('#exportCsv'))exportCSV();if(e.target.closest('#logoutBtn'))signOut();if(e.target.closest('#importJson')||e.target.closest('#importLegacyJson'))importJSONBackup()});render();bootAuth();
})();
</script></body></html>
